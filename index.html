<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arcstake</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0b0f1a;
      color:white;
      text-align:center;
    }

    .hero{
      padding:100px 20px;
    }

    h1{
      font-size:60px;
      background:linear-gradient(90deg,#ff00cc,#7c3aed);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    p{
      color:#cbd5e1;
      max-width:700px;
      margin:auto;
      margin-top:20px;
      font-size:20px;
    }

    button{
      margin-top:30px;
      padding:15px 35px;
      border:none;
      border-radius:12px;
      background:linear-gradient(90deg,#ff00cc,#7c3aed);
      color:white;
      font-size:18px;
    }
  </style>
</head>

<body>

  <div class="hero">
    <h1>Arcstake</h1>

    <p>
      Next generation crypto platform for staking, trading and prediction markets.
    </p>

    <button>
      Launch App
    </button>
  </div>

</body>
</html>
